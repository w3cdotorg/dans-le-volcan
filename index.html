<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dans mon volcan — petit explorateur du volcan</title>
<meta name="description" content="Petit explorateur du volcan pour les enfants : dehors, dedans, les profondeurs, et l'histoire d'une éruption, racontée à voix haute.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DANS MON VOLCAN — mini-explorateur pour les 4-5 ans
   Petit frère de « Dans mon corps » : même esthétique de
   planétarium et de cartes en verre dépoli, mais réchauffée
   (lueur de magma, braises flottantes).
   Un seul fichier, aucune dépendance obligatoire.
   ============================================================ */

:root{
  /* fond planétarium réchauffé */
  --night-1:#160b26;
  --night-2:#251043;
  --night-3:#341a55;
  --cream:#fff4e2;
  --cream-soft:#d8cdf0;

  /* magma / braises */
  --lave:#ff5a2a;
  --magma:#ff7a3c;
  --braise:#ffb15c;
  --cendre:#8b8296;

  /* couleurs des 3 vues (coupe) */
  --c-dehors:#7ed98a;
  --c-dedans:#ffb15c;
  --c-prof:#ff6f7d;
  --accent:var(--c-dehors);

  /* décor */
  --skyday:#8fd3ff;
  --foret:#3f9d5a;
  --roche:#6b5b73;
  --roche-sombre:#3d3247;

  --pad:clamp(12px, 2.2vw, 26px);
  --r-lg:34px;
  --r-md:22px;

  --font-display:"Fredoka","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  --font-ui:"Baloo 2","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font-ui);
  color:var(--cream);
  background:
    radial-gradient(120% 70% at 50% 4%, var(--night-3) 0%, transparent 62%),
    radial-gradient(90% 55% at 8% 88%, #3a1a4e 0%, transparent 55%),
    radial-gradient(110% 65% at 50% 108%, #ff5a2a22 0%, transparent 62%),
    linear-gradient(175deg, var(--night-1), var(--night-2) 55%, #110a20);
  background-attachment:fixed;
  min-height:100%;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}

/* grain + étoiles (copie du pattern du corps) */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1.6px 1.6px at 20% 18%, rgba(255,255,255,.75) 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 72% 12%, rgba(255,255,255,.6) 50%, transparent 51%),
    radial-gradient(1.8px 1.8px at 86% 44%, rgba(255,255,255,.5) 50%, transparent 51%),
    radial-gradient(1.3px 1.3px at 12% 62%, rgba(255,255,255,.55) 50%, transparent 51%),
    radial-gradient(1.6px 1.6px at 46% 86%, rgba(255,255,255,.45) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 62% 68%, rgba(255,255,255,.5) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 33% 34%, rgba(255,255,255,.4) 50%, transparent 51%);
  opacity:.9;
  animation:twinkle 5s ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:.85}50%{opacity:.45}}

/* braises flottantes : montent en oscillant */
.braises{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.braises i{
  position:absolute;bottom:-60px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #fff2d8, var(--braise) 55%, var(--lave) 90%);
  box-shadow:0 0 8px 2px rgba(255,122,60,.55);
  animation:monte linear infinite;
}
@keyframes monte{
  0%{transform:translate(0,0) scale(.6);opacity:0}
  8%{opacity:.9}
  25%{transform:translate(10px,-25vh) scale(.8)}
  50%{transform:translate(-9px,-55vh) scale(.95)}
  75%{transform:translate(10px,-85vh) scale(1.05)}
  100%{transform:translate(-5px,-115vh) scale(1.1);opacity:0}
}

/* ------------------------------- en-tête */
header{
  position:relative;z-index:2;
  padding:clamp(14px,3vw,30px) var(--pad) 0;
  text-align:center;
}
h1{
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(2rem,6.4vw,4.1rem);
  line-height:.98;
  margin:.2em 0 .1em;
  letter-spacing:-.01em;
  background:linear-gradient(178deg,#fff9ef,#ffcf8f 55%,var(--lave));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 24px rgba(255,120,60,.32));
}
h1 .volcan-em{display:inline-block;animation:secousse 2.6s ease-in-out infinite;transform-origin:50% 85%}
@keyframes secousse{0%,55%,100%{transform:rotate(0) translateY(0)}62%{transform:rotate(-4deg) translateY(-1px)}70%{transform:rotate(3deg)}78%{transform:rotate(-2deg) translateY(1px)}86%{transform:rotate(0)}}
.tagline{margin:.2em auto 0;max-width:46ch;color:var(--cream-soft);font-size:clamp(.95rem,2.1vw,1.15rem);font-weight:500}

/* ------------------------------- structure */
.wrap{
  position:relative;z-index:2;
  max-width:1240px;margin:0 auto;
  padding:var(--pad);
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);
  gap:clamp(14px,2.4vw,30px);
  align-items:start;
}
@media (max-width:900px){ .wrap{grid-template-columns:1fr} }

.card{
  background:linear-gradient(168deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.14);
  border-radius:var(--r-lg);
  padding:clamp(14px,2.2vw,22px);
  backdrop-filter:blur(10px);
  box-shadow:0 22px 50px -28px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.16);
}

/* ------------------------------- scène (le volcan) */
.scene{display:flex;flex-direction:column;gap:clamp(10px,2vw,16px)}
.svgbox{
  position:relative;
  margin:2px auto 0;width:100%;
  border-radius:var(--r-md);
  overflow:hidden;
  background:radial-gradient(60% 45% at 50% 100%, rgba(255,140,70,.18), transparent 70%);
}
svg#volcan{display:block;width:100%;height:auto;max-height:min(58vh,560px);margin:0 auto}
@media (max-width:900px){ svg#volcan{max-height:52vh} }

/* ------------------------------- curseur temps */
.time-control{display:flex;flex-direction:column;gap:8px}
#time{width:100%}
.moments{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.moment{
  cursor:pointer;font-family:var(--font-display);font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:.15em;
  padding:.5em .15em .45em;border-radius:16px;
  border:2px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.05);
  color:var(--cream);font-size:clamp(.6rem,1.4vw,.82rem);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1), background .25s, border-color .25s, box-shadow .25s;
  line-height:1.05;text-align:center;
}
.moment .em{font-size:clamp(1.2rem,3vw,1.6rem);line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.moment:hover{transform:translateY(-3px)}
.moment.active{
  background:color-mix(in srgb, var(--lave) 28%, transparent);
  border-color:var(--lave);
  box-shadow:0 0 0 4px color-mix(in srgb, var(--lave) 16%, transparent);
}

/* ------------------------------- panneau info / commandes */
.panel{display:flex;flex-direction:column;gap:clamp(12px,2vw,18px)}

.cuts{display:flex;align-items:center;gap:16px}
.pills{display:flex;flex-direction:column;gap:8px;flex:1}
.pill{
  cursor:pointer;font-family:var(--font-display);font-weight:600;
  display:flex;align-items:center;gap:.55em;
  padding:.5em .9em;border-radius:999px;
  border:2px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.05);
  color:var(--cream);font-size:clamp(.82rem,1.7vw,.98rem);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1), background .25s, border-color .25s, box-shadow .25s;
}
.pill .em{font-size:1.3em;line-height:1}
.pill:hover{transform:translateX(3px)}
.pill.active{
  background:color-mix(in srgb, var(--accent) 28%, transparent);
  border-color:var(--accent);
  box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent);
}

/* ------------------------------- sliders (gros pouces) */
input[type=range]{
  -webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:22px;border-radius:999px;
  background:linear-gradient(90deg,var(--braise),var(--lave));
  border:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.35);
}
input[type=range]::-moz-range-track{
  height:22px;border-radius:999px;
  background:linear-gradient(90deg,var(--braise),var(--lave));
  border:1px solid rgba(255,255,255,.28);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:38px;height:38px;margin-top:-9px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #fff, #ffe6bd 55%, var(--lave));
  border:3px solid #fff;
  box-shadow:0 6px 18px -4px rgba(0,0,0,.7);
  transition:transform .15s;
}
input[type=range]::-moz-range-thumb{
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #fff, #ffe6bd 55%, var(--lave));
  border:3px solid #fff;box-shadow:0 6px 18px -4px rgba(0,0,0,.7);
}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.14)}
input[type=range]:focus-visible{outline:3px solid var(--braise);outline-offset:6px;border-radius:999px}

.cut-wrap{width:44px;height:200px;margin:4px auto 0;display:flex;align-items:center;justify-content:center}
#cut{width:200px;height:38px;transform:rotate(90deg)}
#cut::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--c-dehors),var(--c-dedans) 50%,var(--c-prof))}
#cut::-moz-range-track{background:linear-gradient(90deg,var(--c-dehors),var(--c-dedans) 50%,var(--c-prof))}

/* accent de couleur par vue active (coupe), consommé par .pill.active et .info::after */
body[data-vue="0"]{--accent:var(--c-dehors)}
body[data-vue="1"]{--accent:var(--c-dedans)}
body[data-vue="2"]{--accent:var(--c-prof)}

/* ------------------------------- carte info */
.info{position:relative;overflow:hidden;min-height:170px;display:flex;flex-direction:column}
.info::after{
  content:"";position:absolute;inset:-40% -30% auto auto;width:70%;aspect-ratio:1;
  background:radial-gradient(circle, color-mix(in srgb,var(--accent) 42%, transparent), transparent 68%);
  pointer-events:none;
}
.info .big{font-size:clamp(2.4rem,6.4vw,3.2rem);line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.45))}
.info h2{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(1.3rem,3.6vw,1.85rem);line-height:1.05;margin:.28em 0 .12em;
  color:#fff;
}
.info p{margin:.4em 0 0;font-size:clamp(.95rem,2vw,1.05rem);line-height:1.5;color:var(--cream-soft);font-weight:500}

/* ------------------------------- boutons */
.tools{display:flex;flex-direction:column;gap:12px}
.btnbar{display:flex;flex-wrap:wrap;gap:10px}
.btn{
  font-family:var(--font-display);font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:.45em;
  padding:.55em 1.1em;border-radius:999px;border:2px solid transparent;
  font-size:clamp(.85rem,1.8vw,1rem);
  background:linear-gradient(160deg,#fff6e2,#ffab6b);color:#3d220b;
  box-shadow:0 10px 24px -12px rgba(255,171,107,.95);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), filter .2s;
}
.btn:hover{transform:translateY(-3px) scale(1.03)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.ghostbtn{background:rgba(255,255,255,.08);color:var(--cream);border-color:rgba(255,255,255,.24);box-shadow:none}
.btn.play{background:linear-gradient(160deg,#ffd9a8,var(--lave));color:#2e0e02;box-shadow:0 10px 24px -12px rgba(255,90,42,.95)}
.btn[aria-pressed="false"]{filter:grayscale(.5) brightness(.9)}

footer{
  position:relative;z-index:2;text-align:center;
  padding:6px var(--pad) 30px;color:#b09bd6;font-size:.86rem;font-weight:500;
}

/* ------------------------------- fumerolles (vue Dehors)
   Volutes qui montent lentement au-dessus du cratère.
   En @keyframes CSS pour être coupées par la règle reduced-motion. */
#d-fumee .volute{transform-box:fill-box;transform-origin:50% 100%;animation:volute 7.5s ease-in-out infinite}
#d-fumee .volute:nth-of-type(2){animation-duration:9.5s;animation-delay:-3s}
#d-fumee .volute:nth-of-type(3){animation-duration:11.5s;animation-delay:-6s}
@keyframes volute{
  0%{opacity:0;transform:translate(0,8px) scale(.86)}
  22%{opacity:.9}
  68%{opacity:.55}
  100%{opacity:0;transform:translate(-10px,-32px) scale(1.2)}
}

/* ------------------------------- bulles de la chambre (vue Dedans)
   Le magma bouillonne : les bulles remontent puis crèvent en surface. */
#c-bulles .bulle{transform-box:fill-box;transform-origin:50% 50%;animation:bulle 6s ease-in-out infinite}
#c-bulles .bulle:nth-of-type(2){animation-duration:7.5s;animation-delay:-2.4s}
#c-bulles .bulle:nth-of-type(3){animation-duration:5.2s;animation-delay:-1.1s}
#c-bulles .bulle:nth-of-type(4){animation-duration:8.4s;animation-delay:-4.6s}
#c-bulles .bulle:nth-of-type(5){animation-duration:6.8s;animation-delay:-3.3s}
@keyframes bulle{
  0%{opacity:0;transform:translate(0,12px) scale(.45)}
  18%{opacity:.85}
  72%{opacity:.5}
  100%{opacity:0;transform:translate(-4px,-52px) scale(1.2)}
}

/* ------------------------------- les profondeurs (vue Profondeurs)
   Le manteau coule au ralenti (convection + ondulations), la zone de
   fusion respire, et les gouttes de #p-flux remontent le conduit. */

/* les deux grandes cellules de convection : elles enflent et se rétractent */
#p-manteau > ellipse{transform-box:fill-box;transform-origin:50% 50%;animation:p-convection 15s ease-in-out infinite}
#p-manteau > ellipse:nth-of-type(2){animation-duration:19s;animation-delay:-6s}
@keyframes p-convection{
  0%,100%{opacity:.8;transform:scale(1)}
  50%{opacity:1;transform:scale(1.09)}
}

/* ondulations : de longues nappes de roche molle qui dérivent */
#p-manteau .onde{transform-box:fill-box;transform-origin:50% 50%;animation:p-onde 18s ease-in-out infinite}
#p-manteau .onde:nth-of-type(2){animation-duration:23s;animation-delay:-7s}
#p-manteau .onde:nth-of-type(3){animation-duration:27s;animation-delay:-13s}
#p-manteau .onde:nth-of-type(4){animation-duration:21s;animation-delay:-4s}
#p-manteau .onde:nth-of-type(5){animation-duration:25s;animation-delay:-9s}
@keyframes p-onde{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(18px,-8px)}
}

/* la zone de fusion : la lueur respire, les perles de magma frémissent */
#p-fusion .lueur{transform-box:fill-box;transform-origin:50% 50%;animation:p-fusion 5.5s ease-in-out infinite}
#p-fusion .lueur:nth-of-type(2){animation-duration:7.4s;animation-delay:-2.2s}
@keyframes p-fusion{
  0%,100%{opacity:.85;transform:scale(1)}
  50%{opacity:1;transform:scale(1.07)}
}
/* les perles servent deux fois : dans la zone de fusion et, plus rares,
   au milieu du manteau. Les retards sont comptés dans chaque groupe. */
#g-prof .perle{transform-box:fill-box;transform-origin:50% 50%;animation:p-perle 4.4s ease-in-out infinite}
#g-prof .perle:nth-of-type(2){animation-duration:5.6s;animation-delay:-1.4s}
#g-prof .perle:nth-of-type(3){animation-duration:6.4s;animation-delay:-2.8s}
#g-prof .perle:nth-of-type(4){animation-duration:4.9s;animation-delay:-.7s}
#g-prof .perle:nth-of-type(5){animation-duration:6s;animation-delay:-3.4s}
#g-prof .perle:nth-of-type(6){animation-duration:5.2s;animation-delay:-1.9s}
#g-prof .perle:nth-of-type(7){animation-duration:6.8s;animation-delay:-4.1s}
#g-prof .perle:nth-of-type(8){animation-duration:4.6s;animation-delay:-2.3s}
@keyframes p-perle{
  0%,100%{opacity:.85;transform:translate(0,0) scale(.94)}
  50%{opacity:1;transform:translate(2px,-6px) scale(1.08)}
}

/* la remontée : ~2.5s par goutte au repos. La durée passe par --flux-d,
   et les 6 retards en sont des fractions : la vue peut donc accélérer
   tout le train de gouttes en ne changeant qu'une valeur. */
#p-flux{--flux-d:2.5s}
#p-flux .goutte{
  transform-box:fill-box;transform-origin:50% 50%;
  animation:p-flux var(--flux-d) linear infinite;
  animation-delay:calc(var(--i) * var(--flux-d) / -6);
}
@keyframes p-flux{
  0%{opacity:0;transform:translate(0,8px) scale(.5)}
  15%{opacity:1;transform:translate(1px,0) scale(1)}
  80%{opacity:.95}
  100%{opacity:0;transform:translate(12px,-110px) scale(.7)}
}

/* les éclats de séisme : ils clignotent chacun à son rythme */
#p-seisme .eclat{transform-box:fill-box;transform-origin:50% 55%;animation:p-eclat 2.1s ease-in-out infinite}
#p-seisme > g:nth-of-type(2) .eclat{animation-duration:1.7s;animation-delay:-.6s}
#p-seisme > g:nth-of-type(3) .eclat{animation-duration:2.5s;animation-delay:-1.2s}
@keyframes p-eclat{
  0%,100%{opacity:.15;transform:scale(.82)}
  16%{opacity:1;transform:scale(1.16)}
  42%{opacity:.45;transform:scale(.96)}
}

/* le filet de fumée du volcan miniature (coordonnées du groupe réduit :
   les distances y sont ~5,7× plus grandes qu'à l'écran) */
#p-volcan .puff{transform-box:fill-box;transform-origin:50% 100%;animation:p-puff 7s ease-in-out infinite}
#p-volcan .puff:nth-of-type(2){animation-duration:9.5s;animation-delay:-4s}
@keyframes p-puff{
  0%{opacity:0;transform:translate(0,10px) scale(.6)}
  30%{opacity:.75}
  100%{opacity:0;transform:translate(-34px,-96px) scale(1.5)}
}

/* ------------------------------- curseur temps (Task 6)
   Séisme du réveil : tout le volcan tremble légèrement. Coupé par la
   règle reduced-motion ci-dessous (elle cible *, donc #volcan aussi). */
.tremble #volcan{animation:tremble .18s linear infinite}
@keyframes tremble{
  25%{transform:translate(1.5px,-1px)}
  75%{transform:translate(-1.5px,1px)}
}
/* remontée accélérée du magma en profondeur pendant l'éruption : on ne
   change qu'une seule variable, --flux-d (cf. #p-flux plus haut). La
   règle sur #p-flux lui-même a une spécificité (1 ID) trop faible face
   à sa propre déclaration ; on cible donc aussi le descendant directement
   (2 ID) pour être certain de l'emporter. */
#g-prof.flux-fort{--flux-d:.9s}
#g-prof.flux-fort #p-flux{--flux-d:.9s}

/* ------------------------------- zones cliquables + carte info (Task 7)
   .selected utilise un filter:drop-shadow (pas un stroke) : certaines zones
   sont sous clip-path (c-magma, les strates) ou remplies par <use>, et un
   drop-shadow appliqué à un élément clippé suit fidèlement la forme visible
   après découpe — un stroke serait lui-même coupé net par le clip. Comme ce
   n'est pas une animation, .selected reste visible même en reduced-motion. */
.zone{cursor:pointer}
.zone.selected{filter:drop-shadow(0 0 3px var(--cream)) drop-shadow(0 0 9px var(--cream))}

/* « Montrer les zones » : 3 pulsations en 3.5s, une seule animation (pas de
   iteration-count) pour rester alignée sur le setTimeout JS qui retire la
   classe côté body à 3500ms. */
@keyframes pulse-zone{
  0%,100%{filter:drop-shadow(0 0 0 transparent)}
  16.6%{filter:drop-shadow(0 0 9px var(--cream))}
  33.3%{filter:drop-shadow(0 0 0 transparent)}
  50%{filter:drop-shadow(0 0 9px var(--cream))}
  66.6%{filter:drop-shadow(0 0 0 transparent)}
  83.3%{filter:drop-shadow(0 0 9px var(--cream))}
}
.show-zones .zone{animation:pulse-zone 3.5s ease-in-out}

/* étiquette flottante SVG : petit label repositionné en JS près de la zone
   cliquée, en plus de la carte #info. pointer-events:none : elle ne doit
   jamais intercepter de clic (ni gêner le futur mini-jeu de la Task 10).
   Visibilité pilotée par une CLASSE (.visible), pas par style.opacity inline :
   un inline style sur la même propriété que la règle de base ne l'emportait
   pas de façon fiable ici (constaté en navigateur avec cette règle+transition
   sur un <g> SVG), alors qu'un ajout de classe n'entre jamais en conflit avec
   la règle de base sur le même sélecteur. */
#label-flottant{opacity:0;pointer-events:none;transition:opacity .18s}
#label-flottant.visible{opacity:1}
#label-bg{fill:rgba(22,11,38,.92);stroke:rgba(255,244,226,.45);stroke-width:1.5}
#label-text{font-family:var(--font-display);font-weight:600;font-size:16px;fill:var(--cream);text-anchor:middle;dominant-baseline:middle}

/* carte info : petite pulsation à chaque nouvelle sélection */
.info{transition:box-shadow .3s}
.info.open{box-shadow:0 22px 50px -28px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.16), 0 0 0 3px color-mix(in srgb, var(--accent) 55%, transparent)}
.info .big{display:inline-block}
.info.flash .big{animation:info-pop .3s ease}
@keyframes info-pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}

@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none !important;transition:none !important} }
</style>
</head>
<body>

<div class="braises" aria-hidden="true">
  <i style="left:4%;width:7px;height:7px;animation-duration:9s;animation-delay:0s"></i>
  <i style="left:14%;width:5px;height:5px;animation-duration:7.5s;animation-delay:1.2s"></i>
  <i style="left:24%;width:9px;height:9px;animation-duration:10.5s;animation-delay:.4s"></i>
  <i style="left:38%;width:6px;height:6px;animation-duration:8.2s;animation-delay:2.6s"></i>
  <i style="left:52%;width:8px;height:8px;animation-duration:9.6s;animation-delay:1.8s"></i>
  <i style="left:64%;width:5px;height:5px;animation-duration:7s;animation-delay:.9s"></i>
  <i style="left:76%;width:10px;height:10px;animation-duration:11s;animation-delay:3.1s"></i>
  <i style="left:86%;width:6px;height:6px;animation-duration:8.6s;animation-delay:2s"></i>
  <i style="left:94%;width:7px;height:7px;animation-duration:9.2s;animation-delay:.6s"></i>
</div>

<header>
  <h1>Dans mon volcan <span class="volcan-em" aria-hidden="true">🌋</span></h1>
  <p class="tagline">Tourne les deux boutons&nbsp;: découvre le volcan et fais-le entrer en éruption&nbsp;!</p>
</header>

<div class="wrap">

  <!-- ======================= SCÈNE ======================= -->
  <main class="scene card" aria-label="Le volcan">
    <div class="svgbox">
      <svg id="volcan" viewBox="0 0 900 560" role="img" aria-label="Le volcan">
        <defs>
          <!-- ============ dégradés (préfixe grad-d- : vue Dehors) ============ -->
          <linearGradient id="grad-d-ciel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#79c7ff"/>
            <stop offset=".34" stop-color="#a6dbfb"/>
            <stop offset=".60" stop-color="#fff1dc"/>
            <stop offset="1" stop-color="#fff4e2"/>
          </linearGradient>
          <radialGradient id="grad-d-soleil" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#fffbe8" stop-opacity=".95"/>
            <stop offset=".34" stop-color="#ffeeb4" stop-opacity=".5"/>
            <stop offset="1" stop-color="#ffe9a6" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="grad-d-brume" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff6e6" stop-opacity="0"/>
            <stop offset="1" stop-color="#fff6e6" stop-opacity=".8"/>
          </linearGradient>
          <linearGradient id="grad-d-cone" x1="1" y1="0" x2=".1" y2=".8">
            <stop offset="0" stop-color="#b3a0ad"/>
            <stop offset=".38" stop-color="#8b7889"/>
            <stop offset=".76" stop-color="#6b5b73"/>
            <stop offset="1" stop-color="#584a63"/>
          </linearGradient>
          <linearGradient id="grad-d-calotte" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#dccbdb" stop-opacity=".62"/>
            <stop offset="1" stop-color="#dccbdb" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="grad-d-vieille" x1="0" y1="0" x2=".3" y2="1">
            <stop offset="0" stop-color="#3b3149"/>
            <stop offset="1" stop-color="#221b2e"/>
          </linearGradient>
          <linearGradient id="grad-d-lave" x1="0" y1="0" x2=".2" y2="1">
            <stop offset="0" stop-color="#fff0b0"/>
            <stop offset=".28" stop-color="#ffb15c"/>
            <stop offset="1" stop-color="#ff5a2a"/>
          </linearGradient>
          <radialGradient id="grad-d-lueur" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#fff2c0"/>
            <stop offset=".38" stop-color="#ff7a3c"/>
            <stop offset="1" stop-color="#ff5a2a" stop-opacity="0"/>
          </radialGradient>
          <!-- userSpaceOnUse : un seul dégradé pour toutes les boules du panache,
               sinon chaque cercle est ombré séparément et les raccords se voient -->
          <linearGradient id="grad-d-panache" gradientUnits="userSpaceOnUse" x1="380" y1="112" x2="516" y2="8">
            <stop offset="0" stop-color="#8b8296"/>
            <stop offset=".55" stop-color="#b3aabe"/>
            <stop offset="1" stop-color="#ddd6e4"/>
          </linearGradient>
          <linearGradient id="grad-d-riviere" x1="0" y1="0" x2=".25" y2="1">
            <stop offset="0" stop-color="#8fd3ff"/>
            <stop offset="1" stop-color="#3f93cf"/>
          </linearGradient>
          <linearGradient id="grad-d-prairie" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#83c78d"/>
            <stop offset="1" stop-color="#57a768"/>
          </linearGradient>
          <linearGradient id="grad-d-prairie2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5fae70"/>
            <stop offset="1" stop-color="#43975b"/>
          </linearGradient>

          <!-- ============ dégradés (préfixe grad-c- : vue Dedans) ============ -->
          <!-- sous-sol : la roche qui entoure la chambre magmatique -->
          <linearGradient id="grad-c-sous-sol" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5b4a63"/>
            <stop offset=".42" stop-color="#40334c"/>
            <stop offset="1" stop-color="#281e36"/>
          </linearGradient>
          <!-- croûte externe du cône : mêmes arrêts que grad-d-cone, pour que
               le fondu Dehors → Dedans ne fasse pas sauter la couleur du flanc -->
          <linearGradient id="grad-c-flanc" x1="1" y1="0" x2=".1" y2=".8">
            <stop offset="0" stop-color="#b3a0ad"/>
            <stop offset=".38" stop-color="#8b7889"/>
            <stop offset=".76" stop-color="#6b5b73"/>
            <stop offset="1" stop-color="#584a63"/>
          </linearGradient>
          <linearGradient id="grad-c-strate-lave" x1="0" y1="0" x2=".22" y2="1">
            <stop offset="0" stop-color="#76596c"/>
            <stop offset="1" stop-color="#4a3752"/>
          </linearGradient>
          <linearGradient id="grad-c-strate-cendre" x1="0" y1="0" x2=".22" y2="1">
            <stop offset="0" stop-color="#e7d3b6"/>
            <stop offset="1" stop-color="#c1a68f"/>
          </linearGradient>
          <!-- le magma de la chambre : cœur jaune, bords rouges.
               userSpaceOnUse : le dégradé suit la poche, pas la boîte du path
               (qui déborde volontairement sous la chambre) -->
          <radialGradient id="grad-c-magma" gradientUnits="userSpaceOnUse" cx="450" cy="474" r="200">
            <stop offset="0" stop-color="#fff6c8"/>
            <stop offset=".26" stop-color="#ffcb6d"/>
            <stop offset=".58" stop-color="#ff8a42"/>
            <stop offset="1" stop-color="#e8431f"/>
          </radialGradient>
          <linearGradient id="grad-c-colonne" x1="0" y1="0" x2=".3" y2="1">
            <stop offset="0" stop-color="#fff3b4"/>
            <stop offset=".2" stop-color="#ffbe66"/>
            <stop offset="1" stop-color="#ff6a2e"/>
          </linearGradient>
          <radialGradient id="grad-c-chaleur" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#ff8a42" stop-opacity=".6"/>
            <stop offset=".5" stop-color="#ff5a2a" stop-opacity=".24"/>
            <stop offset="1" stop-color="#ff5a2a" stop-opacity="0"/>
          </radialGradient>
          <!-- le vide : cheminée et cratère quand le magma est loin -->
          <linearGradient id="grad-c-vide" x1="0" y1="0" x2=".45" y2="1">
            <stop offset="0" stop-color="#40304a"/>
            <stop offset="1" stop-color="#1e1529"/>
          </linearGradient>
          <linearGradient id="grad-c-bouchon" x1=".15" y1="0" x2=".85" y2="1">
            <stop offset="0" stop-color="#ad9bab"/>
            <stop offset=".5" stop-color="#7d6b84"/>
            <stop offset="1" stop-color="#50435c"/>
          </linearGradient>
          <linearGradient id="grad-c-adventif" x1=".15" y1="0" x2=".7" y2="1">
            <stop offset="0" stop-color="#ab9caa"/>
            <stop offset=".55" stop-color="#7f6d84"/>
            <stop offset="1" stop-color="#5a4c66"/>
          </linearGradient>
          <!-- userSpaceOnUse : un seul dégradé pour tout le chou-fleur -->
          <linearGradient id="grad-c-panache" gradientUnits="userSpaceOnUse" x1="386" y1="116" x2="516" y2="4">
            <stop offset="0" stop-color="#8b8296"/>
            <stop offset=".55" stop-color="#b3aabe"/>
            <stop offset="1" stop-color="#e2dbe9"/>
          </linearGradient>
          <linearGradient id="grad-c-coulee" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff0b0"/>
            <stop offset=".3" stop-color="#ffb15c"/>
            <stop offset="1" stop-color="#ff5a2a"/>
          </linearGradient>
          <linearGradient id="grad-c-fontaine" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#fff8dc"/>
            <stop offset=".4" stop-color="#ffc36b"/>
            <stop offset="1" stop-color="#ff6f3a" stop-opacity=".15"/>
          </linearGradient>
          <radialGradient id="grad-c-bombe" cx=".34" cy=".28" r=".85">
            <stop offset="0" stop-color="#fff2c8"/>
            <stop offset=".42" stop-color="#ff9b4a"/>
            <stop offset="1" stop-color="#a8321a"/>
          </radialGradient>

          <!-- ============ dégradés (préfixe grad-p- : vue Profondeurs) ============ -->
          <!-- la vue a sa propre bande de ciel : mêmes bleus que grad-d-ciel, pour
               que le fondu Dedans → Profondeurs ne fasse pas sauter le haut -->
          <linearGradient id="grad-p-ciel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#79c7ff"/>
            <stop offset=".55" stop-color="#a6dbfb"/>
            <stop offset="1" stop-color="#e4f2fd"/>
          </linearGradient>
          <linearGradient id="grad-p-mer" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8ed0f5"/>
            <stop offset=".45" stop-color="#3f93cf"/>
            <stop offset="1" stop-color="#1d5d95"/>
          </linearGradient>
          <!-- LE spectacle de la vue : rouge sombre en haut, pourpre chaleureux en bas -->
          <linearGradient id="grad-p-manteau" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c4432c"/>
            <stop offset=".2" stop-color="#a52a35"/>
            <stop offset=".52" stop-color="#82204a"/>
            <stop offset=".8" stop-color="#5b1a4d"/>
            <stop offset="1" stop-color="#3b1342"/>
          </linearGradient>
          <!-- cellules de convection : la roche molle tourne très lentement -->
          <radialGradient id="grad-p-convection" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#ff9b4a" stop-opacity=".4"/>
            <stop offset=".55" stop-color="#ff5a2a" stop-opacity=".15"/>
            <stop offset="1" stop-color="#ff5a2a" stop-opacity="0"/>
          </radialGradient>
          <!-- la croûte est une roche CHAUDE (brune) : elle se détache ainsi des
               plaques, qui restent gris-violet -->
          <linearGradient id="grad-p-croute" x1="0" y1="0" x2=".12" y2="1">
            <stop offset="0" stop-color="#b09a86"/>
            <stop offset=".5" stop-color="#8d7562"/>
            <stop offset="1" stop-color="#6b5750"/>
          </linearGradient>
          <linearGradient id="grad-p-plaque-cont" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6b5b73"/>
            <stop offset=".5" stop-color="#514362"/>
            <stop offset="1" stop-color="#382d49"/>
          </linearGradient>
          <!-- la roche qui fond juste au-dessus de la plaque plongeante -->
          <radialGradient id="grad-p-fusion" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#fff2c0" stop-opacity=".95"/>
            <stop offset=".3" stop-color="#ffa24a" stop-opacity=".7"/>
            <stop offset=".66" stop-color="#ff6f2e" stop-opacity=".3"/>
            <stop offset="1" stop-color="#ff5a2a" stop-opacity="0"/>
          </radialGradient>
          <!-- gouttes de magma : le reflet est dans le dégradé, une seule forme suffit -->
          <radialGradient id="grad-p-magma" cx=".34" cy=".28" r=".82">
            <stop offset="0" stop-color="#fff8dc"/>
            <stop offset=".3" stop-color="#ffcf7a"/>
            <stop offset=".68" stop-color="#ff8a42"/>
            <stop offset="1" stop-color="#e8431f"/>
          </radialGradient>
          <!-- le volcan miniature : mêmes arrêts que grad-d-cone, en plus court -->
          <linearGradient id="grad-p-volcan" x1="1" y1="0" x2=".1" y2=".8">
            <stop offset="0" stop-color="#b3a0ad"/>
            <stop offset=".45" stop-color="#8b7889"/>
            <stop offset="1" stop-color="#584a63"/>
          </linearGradient>

          <!-- ============ découpes (vue Dedans) ============ -->
          <!-- la silhouette EXACTE de #d-cone : les strates s'y arrêtent net -->
          <clipPath id="clip-c-cone">
            <path d="M180 340 C240 318 332 254 408 116 Q450 146 492 116 C568 254 660 318 720 340 Z"/>
          </clipPath>
          <!-- entonnoir + conduit : garde la colonne de magma dans la cheminée -->
          <clipPath id="clip-c-cheminee">
            <path d="M409 119 C416 150 434 168 437 196 L437 452 L463 452 L463 196 C466 168 484 150 491 119 Z"/>
          </clipPath>
          <!-- union cône + cône adventif + sous-sol : garde la cheminée
               secondaire dans la roche, jamais dans le ciel -->
          <clipPath id="clip-c-dike">
            <path d="M180 340 C240 318 332 254 408 116 Q450 146 492 116 C568 254 660 318 720 340 Z"/>
            <path d="M674 317.6 C690 302 706 288 716 279 L722 285 L728 279 C740 298 758 324 770 340 L720 340 C708 336 692 327.6 674 317.6 Z"/>
            <rect x="0" y="336" width="900" height="224"/>
          </clipPath>
          <!-- la poche de la chambre : garde le magma dedans quand il monte -->
          <clipPath id="clip-c-chambre">
            <path d="M300 428 C296 392 322 368 362 366 C396 356 436 356 470 364 C520 354 592 372 600 420 C610 466 578 512 520 522 C470 532 410 530 366 518 C318 504 302 468 300 428 Z"/>
          </clipPath>

          <!-- ============ silhouettes de la vue Profondeurs ============
               Chacune sert DEUX fois (une fois remplie, une fois en découpe) :
               elle est définie ici une seule fois pour que les deux usages ne
               puissent pas diverger. -->
          <!-- la croûte continentale : elle s'affine jusqu'à la fosse (272,110) -->
          <path id="p-croute-cont" d="M272 110 C306 92 344 72 386 64 L900 64 L900 96 L386 96 C348 102 312 110 272 110 Z"/>
          <!-- la croûte océanique : fine, posée sur le dos de la plaque -->
          <path id="p-croute-oce" d="M-20 96 L200 96 C226 96 248 99 272 110 L266 122 C244 112 222 108 200 108 L-20 108 Z"/>
          <!-- la lithosphère continentale : un coin épais à droite, effilé sur la fosse -->
          <path id="p-cont-forme" d="M272 110 C306 92 344 72 386 64 L900 64 L900 208 C790 214 680 214 610 206 C530 196 468 180 414 158 C370 140 320 124 272 110 Z"/>
          <!-- l'axe de la langue plongeante : tracée deux fois (bord clair large,
               puis cœur sombre plus fin) pour obtenir une plaque à liseré -->
          <path id="p-langue" fill="none" stroke-linecap="round"
                d="M216 122 C250 124 274 136 296 160 C330 200 364 250 398 304 C438 366 492 440 538 494"/>

          <!-- ============ découpes (vue Profondeurs) ============ -->
          <clipPath id="clip-p-croute">
            <use href="#p-croute-cont"/>
            <use href="#p-croute-oce"/>
          </clipPath>
          <clipPath id="clip-p-cont">
            <use href="#p-cont-forme"/>
          </clipPath>
          <!-- le COIN DE MANTEAU : entre la base de la plaque continentale (dessus)
               et le dos de la plaque plongeante (dessous). La lueur de fusion y est
               découpée, donc elle reste toujours AU-DESSUS de la plaque qui plonge. -->
          <clipPath id="clip-p-coin">
            <path d="M288 118 C340 134 380 148 414 158 C468 180 530 196 600 206 L640 320 L560 480 C520 424 460 340 417 291 C392 252 366 214 340 179 C322 154 306 132 288 118 Z"/>
          </clipPath>

          <!-- ============ formes réutilisées ============ -->
          <!-- bombe volcanique : fuseau (pointu aux deux bouts) -->
          <path id="c-bombe" d="M-13 0 Q0 -6.4 13 0 Q0 6.4 -13 0 Z"/>
          <!-- conifère : les étages n'ont pas de fill → ils héritent du <use> -->
          <g id="d-sapin">
            <rect x="-3" y="-11" width="6" height="13" rx="2" fill="#6d4c37"/>
            <path d="M0 -31 L22 -2 Q11 3 0 2 Q-11 3 -22 -2 Z"/>
            <path d="M0 -45 L18 -17 Q9 -12 0 -13 Q-9 -12 -18 -17 Z"/>
            <path d="M0 -58 L13 -32 Q6.5 -28 0 -28 Q-6.5 -28 -13 -32 Z"/>
          </g>
          <!-- fleur de prairie : les pétales héritent du fill du <use> -->
          <g id="d-fleur">
            <path d="M0 0 C-.5 -5 .5 -9 0 -12" stroke="#3f8f52" stroke-width="1.8" fill="none" stroke-linecap="round"/>
            <path d="M0 -5 C-5 -6 -7 -9 -3 -10 C-1 -9 -.5 -7 0 -5 Z" fill="#4aa562"/>
            <circle cx="0" cy="-20" r="4.2"/>
            <circle cx="-4.76" cy="-16.55" r="4.2"/>
            <circle cx="-2.94" cy="-10.95" r="4.2"/>
            <circle cx="2.94" cy="-10.95" r="4.2"/>
            <circle cx="4.76" cy="-16.55" r="4.2"/>
            <circle cx="0" cy="-15" r="2.7" fill="#ffd45e"/>
          </g>
          <!-- pousse verte (phase « repos ») -->
          <g id="d-pousse">
            <path d="M0 0 C.5 -5 -.5 -9 0 -13" stroke="#3f9d5a" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M0 -8 C-7 -11 -9 -17 -2 -16 C1 -14 1 -10 0 -8 Z" fill="#4fb46a"/>
            <path d="M0 -11 C7 -14 9 -20 2 -19 C-1 -17 -1 -13 0 -11 Z" fill="#6ccb84"/>
          </g>
          <!-- oiseau en « accent » -->
          <g id="d-oiseau">
            <path d="M-11 0 Q-5.5 -7 0 -1.5 Q5.5 -7 11 0" fill="none" stroke="#4a4159" stroke-width="2.6" stroke-linecap="round"/>
          </g>
          <!-- éclair de séisme : le <use> n'a pas de transform à lui, l'animation
               CSS peut donc s'en servir librement (le placement est sur le <g> parent) -->
          <g id="p-eclair">
            <path d="M1 -12 L-7 2 L-1.5 2 L-3.5 12 L7 -3 L1 -3 Z"
                  fill="#fff3c4" stroke="#ffb15c" stroke-width="1.6" stroke-linejoin="round"/>
          </g>
          <!-- les 3 langues de coulée : servent en orange (éruption) puis en noir (refroidi) -->
          <g id="d-langues">
            <path d="M436 126 C428 168 416 212 402 256 C393 286 385 310 378 334 Q396 344 414 334 C419 310 425 284 431 256 C439 210 448 166 452 126 Z"/>
            <path d="M468 126 C480 166 502 208 528 244 C550 274 576 300 594 324 Q590 338 566 336 C544 312 518 284 496 252 C472 216 454 174 448 128 Z"/>
            <path d="M424 128 C410 164 390 200 366 232 C346 258 328 282 314 306 Q322 320 344 316 C360 294 378 270 396 244 C418 210 436 176 446 132 Z"/>
          </g>
          <!-- rougeoiement du ciel (Task 6) : lueur douce centrée sur le cratère,
               son opacité est pilotée en JS via --rougeoiement -->
          <radialGradient id="grad-t-rouge" cx=".5" cy=".62" r=".62" gradientUnits="objectBoundingBox">
            <stop offset="0" stop-color="#ff5a1f" stop-opacity=".65"/>
            <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- ==================================================================
             CIEL — fond partagé Dehors / Dedans
             ================================================================== -->
        <g id="g-ciel">
          <rect x="0" y="0" width="900" height="560" fill="url(#grad-d-ciel)"/>

          <!-- soleil doux, en haut à droite -->
          <circle cx="792" cy="64" r="82" fill="url(#grad-d-soleil)"/>
          <circle cx="792" cy="64" r="33" fill="#fff8dc" opacity=".92"/>
          <circle cx="792" cy="64" r="24" fill="#fffdf1" opacity=".85"/>

          <!-- nuage 1 : le gros, cliquable -->
          <g id="d-nuage" class="zone" tabindex="0" role="button" transform="translate(202 80)">
            <g fill="#ffffff" opacity=".95">
              <ellipse cx="-48" cy="8" rx="35" ry="22"/>
              <ellipse cx="-9" cy="-10" rx="43" ry="30"/>
              <ellipse cx="33" cy="1" rx="36" ry="24"/>
              <ellipse cx="62" cy="11" rx="24" ry="16"/>
              <rect x="-80" y="6" width="164" height="21" rx="10.5"/>
            </g>
            <path d="M-80 22 Q-20 32 84 22 L84 27 Q-20 34 -80 27 Z" fill="#cfe4f4" opacity=".7"/>
          </g>

          <!-- nuage 2 -->
          <g fill="#ffffff" opacity=".85" transform="translate(614 50) scale(.72)">
            <ellipse cx="-38" cy="7" rx="28" ry="18"/>
            <ellipse cx="-2" cy="-8" rx="36" ry="25"/>
            <ellipse cx="32" cy="4" rx="26" ry="17"/>
            <rect x="-64" y="4" width="120" height="18" rx="9"/>
          </g>

          <!-- nuage 3 : lointain, effiloché -->
          <g fill="#ffffff" opacity=".6" transform="translate(112 194) scale(.56)">
            <ellipse cx="-34" cy="6" rx="26" ry="14"/>
            <ellipse cx="0" cy="-5" rx="34" ry="20"/>
            <ellipse cx="32" cy="4" rx="24" ry="13"/>
            <rect x="-58" y="2" width="112" height="14" rx="7"/>
          </g>

          <!-- rougeoiement de l'éruption : dernier enfant, posé au-dessus du ciel -->
          <rect class="rouge" x="0" y="0" width="900" height="560" fill="url(#grad-t-rouge)"
                pointer-events="none" style="opacity:var(--rougeoiement,0)"/>
        </g>

        <!-- ==================================================================
             DEHORS — le volcan endormi dans son paysage
             ================================================================== -->
        <g id="g-dehors">

          <!-- ---------- collines lointaines + brume d'horizon ---------- -->
          <path d="M-10 346 C90 320 200 312 300 322 C372 330 416 336 460 336 C540 332 620 310 720 314 C822 318 880 330 910 346 Z" fill="#b6d6c6" opacity=".85"/>
          <path d="M-10 346 C34 316 88 300 142 306 C190 312 218 328 244 346 Z" fill="#96c0ae"/>
          <path d="M652 346 C694 320 750 302 806 308 C856 314 888 328 910 346 Z" fill="#9dc7b3"/>
          <rect x="0" y="300" width="900" height="46" fill="url(#grad-d-brume)"/>

<script>
/* ==========================================================================
   DANS MON VOLCAN — script principal
   Sections :
     5) Curseur COUPE (setCut)      — fondu entre les 3 vues
     6) Curseur TEMPS (setTime)     — à venir
     7) Zones cliquables + INFO     — à venir
     8) Voix (off par défaut)       — à venir
     9) Loupe                       — à venir
    10) Mini-jeu                    — à venir
   ========================================================================== */

/* ---------- utilitaires partagés ---------- */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* ---------- fabrique de glissé doux, annulable ----------
   Chaque appel à la fonction retournée démarre un glissé easeOut vers `target`
   (via `setter`, en lisant la position courante via `getter`). Un jeton de
   génération invalide toute boucle requestAnimationFrame plus ancienne : un
   nouvel appel à la même glide (clavier/pastille pendant un glissé en cours),
   ou un `.cancel()` explicite (ex. drag manuel qui doit reprendre la main),
   coupe net l'ancienne boucle avant qu'elle n'écrase la nouvelle position à la
   frame suivante. Réutilisée par TASK 6 pour `glideTime`. */
function makeGlide(setter, getter, duration = 500){
  const token = {gen: 0};
  function glide(target){
    const my = ++token.gen, from = getter(), t0 = performance.now();
    (function step(now){
      if (my !== token.gen) return;                      // une glide plus récente ou un cancel() a pris le relais
      const k = clamp((now - t0) / duration, 0, 1), e = k*(2-k); // easeOut
      setter(from + (target - from) * e);
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }
  glide.cancel = () => { token.gen++; };                  // invalide la boucle en vol sans repositionner
  return glide;
}

/* ==========================================================================
   5) CURSEUR COUPE — fondu continu Dehors → Dedans → Profondeurs
   Produit : setCut(c), la variable `cut` (0..2), currentView() → 0|1|2.
   ========================================================================== */
let cut = 0;
const VUES = ["#g-dehors","#g-dedans","#g-prof"];
function setCut(c){
  cut = clamp(c, 0, 2);
  VUES.forEach((sel,i) => {
    const g = $(sel), op = clamp(1 - Math.abs(cut - i), 0, 1);
    g.style.opacity = op;
    g.style.pointerEvents = (Math.round(cut) === i) ? "auto" : "none";
  });
  $("#g-ciel").style.opacity = clamp(2 - cut, 0, 1);   // le ciel partagé s'efface vers les profondeurs
  $("#g-ciel").style.pointerEvents = (cut < 1.5) ? "auto" : "none"; // le nuage cliquable (#d-nuage) ne réagit que si le ciel est visible
  $("#cut").value = Math.round(cut * 100);
  $$(".pill").forEach(p => p.classList.toggle("active", +p.dataset.cut === Math.round(cut)));
  document.body.dataset.vue = Math.round(cut);          // accent de couleur par vue via CSS
}
const currentView = () => Math.round(cut);
const glideCut = makeGlide(setCut, () => cut, 500);
$("#cut").addEventListener("input", e => { glideCut.cancel(); setCut(e.target.value / 100); });
$$(".pill").forEach(p => p.addEventListener("click", () => glideCut(+p.dataset.cut)));
addEventListener("keydown", e => {
  if (e.key === "ArrowDown"){ e.preventDefault(); glideCut(clamp(Math.round(cut)+1,0,2)); }
  if (e.key === "ArrowUp"){ e.preventDefault(); glideCut(clamp(Math.round(cut)-1,0,2)); }
});

/* ==========================================================================
   6) CURSEUR TEMPS — l'éruption interpolée sur les 3 vues
   Produit : setTime(t), la variable `time` (0..4), lerpArr(arr,t),
   currentPhase() → 0..4 (0 Endormi, 1 Réveil, 2 Éruption, 3 Coulées, 4 Repos).
   ========================================================================== */
let time = 0;
function lerpArr(arr, t){            // interpolation linéaire par morceaux sur [0..4]
  const i = clamp(Math.floor(t), 0, arr.length - 2), f = t - i;
  return arr[i] + (arr[i+1] - arr[i]) * f;
}
// Tables : 5 valeurs = [endormi, réveil, éruption, coulées, repos]
const OPACITES = [
  ["#d-fumee",          [ .8,  .3,   0,   0,  .5]],
  ["#d-panache-ext",    [  0,  .2,   1,  .35,  0]],
  ["#d-lueur-cratere",  [  0,  .5,   1,  .6,   0]],
  ["#d-coulees-ext",    [  0,   0,  .9,   1,   0]],
  ["#d-coulees-noires", [  0,   0,   0,  .2,   1]],
  ["#d-pousses",        [  0,   0,   0,   0,   1]],
  ["#d-oiseaux",        [  1,  .4,   0,   0,  .8]],   // les oiseaux fuient
  ["#c-panache",        [  0,  .15,  1,  .35,  0]],
  ["#c-bombes",         [  0,   0,   1,  .25,  0]],
  ["#c-fontaine",       [  0,   0,   1,  .4,   0]],

const ROUGE = [0, .12, .75, .4, .05];       // lueur du ciel, appliquée via --rougeoiement
function setTime(t){
  time = clamp(t, 0, 4);
  OPACITES.forEach(([sel, arr]) => { const el = $(sel); if (el) el.style.opacity = lerpArr(arr, time); });
  $("#c-magma-colonne").style.transform = `translateY(${lerpArr(MAGMA_Y, time)}px)`;
  $("#c-magma-niveau").style.transform  = `translateY(${lerpArr(CHAMBRE_Y, time)}px)`;
  document.documentElement.style.setProperty("--rougeoiement", lerpArr(ROUGE, time));
  document.body.classList.toggle("tremble", time > .5 && time < 1.6);   // séisme du réveil
  $("#g-prof").classList.toggle("flux-fort", time > 1.4 && time < 2.8); // remontée accélérée
  $("#time").value = Math.round(time * 100);
  $$(".moment").forEach(m => m.classList.toggle("active", +m.dataset.time === Math.round(time)));
}
const currentPhase = () => Math.round(time);
const glideTime = makeGlide(setTime, () => time, 600);
$("#time").addEventListener("input", e => { glideTime.cancel(); setTime(e.target.value / 100); });
$$(".moment").forEach(m => m.addEventListener("click", () => glideTime(+m.dataset.time)));
addEventListener("keydown", e => {
  if (e.key === "ArrowRight"){ e.preventDefault(); glideTime(clamp(Math.round(time)+1,0,4)); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); glideTime(clamp(Math.round(time)-1,0,4)); }
});

/* getBoundingClientRect()/getBBox() ignorent TOUJOURS le clip-path (c'est le
   comportement standard : le clip est un effet de peinture, pas une réduction
   de boîte englobante — vérifié en navigateur : pour #c-magma, dont la forme
   non découpée descend jusqu'à y=620, le rect obtenu dépasse largement la
   poche visible). Pour approcher la zone VRAIMENT visible d'une zone sous
   clip-path (elle-même ou un ancêtre, ex. c-magma / c-strates-lave), on clone
   temporairement la forme de découpe comme sibling rendu (opacity:0, retiré
   immédiatement après lecture) pour obtenir SON rect dans le même espace, puis
   on intersecte les deux rects. Approximation : si la forme de clip contient
   plusieurs enfants (ex. clip-c-dike), on prend l'union de leurs rects avant
   d'intersecter — suffisant pour positionner une étiquette, pas pour un rendu
   pixel-perfect. */
function clipShapeClientRect(clipPathAttr, hostNode){
  const m = /#([\w-]+)/.exec(clipPathAttr);
  const clipPathEl = m && document.getElementById(m[1]);
  if (!clipPathEl || !clipPathEl.children.length) return null;
  const tempG = document.createElementNS("http://www.w3.org/2000/svg", "g");
  tempG.style.opacity = "0";
  [...clipPathEl.children].forEach(child => tempG.appendChild(child.cloneNode(true)));
  hostNode.appendChild(tempG);
  const r = tempG.getBoundingClientRect();
  hostNode.removeChild(tempG);
  return (r.width > 0 && r.height > 0) ? r : null;
}
function intersectRects(a, b){
  const left = Math.max(a.left, b.left), top = Math.max(a.top, b.top);
  const right = Math.min(a.right, b.right), bottom = Math.min(a.bottom, b.bottom);
  if (right <= left || bottom <= top) return a;         // pas de recouvrement : on garde le rect d'origine
  return new DOMRect(left, top, right - left, bottom - top);
}
function visibleClientRect(el){
  let rect = el.getBoundingClientRect();
  for (let node = el; node && node.tagName !== "svg"; node = node.parentElement){
    const clipAttr = node.getAttribute && node.getAttribute("clip-path");
    if (clipAttr){
      const clipRect = clipShapeClientRect(clipAttr, node);
      if (clipRect) rect = intersectRects(rect, clipRect);
    }
  }
  return rect;
}

/* Étiquette flottante : positionnée via visibleClientRect() + getScreenCTM
   (conversion pixels écran → coordonnées du viewBox). clamp() dans le viewBox
   900×560 pour les zones proches des bords. */
function showLabel(id, el){
  const z = INFO[id];
  const svg = $("#volcan"), g = $("#label-flottant"), txt = $("#label-text"), bg = $("#label-bg");
  const ctm = svg.getScreenCTM();
  if (!ctm) return;                                   // svg pas encore rendu (peu probable)
  const inv = ctm.inverse();
  const r = visibleClientRect(el);
  const p1 = new DOMPoint(r.left, r.top).matrixTransform(inv);
  const p2 = new DOMPoint(r.right, r.bottom).matrixTransform(inv);
  const bx = Math.min(p1.x, p2.x), by = Math.min(p1.y, p2.y);
  const bw = Math.abs(p2.x - p1.x), bh = Math.abs(p2.y - p1.y);
  txt.textContent = `${z.em} ${z.n}`;
  const tb = txt.getBBox();
  const padX = 16, padY = 9;
  const w = tb.width + padX * 2, h = tb.height + padY * 2;
  const x = clamp(bx + bw / 2 - w / 2, 6, 900 - 6 - w);
  const y = clamp(by - h - 12, 6, 560 - 6 - h);
  bg.setAttribute("x", x); bg.setAttribute("y", y);
  bg.setAttribute("width", w); bg.setAttribute("height", h);
  txt.setAttribute("x", x + w / 2); txt.setAttribute("y", y + h / 2);
  g.classList.add("visible");                          // classe, pas style.opacity : cf. commentaire CSS de #label-flottant
}

function showInfo(id, el){
  const z = INFO[id]; if (!z) return;
  el = el || document.getElementById(id);
  // p-seisme, c-panache, c-bombes, c-fontaine, c-coulee restent dans le DOM avec
  // opacity:0 à certains temps mais interceptent quand même les clics (Task 6 pilote
  // leur opacité en style inline). Un enfant ne doit pas déclencher l'explication
  // d'une zone qu'il ne voit pas → on ignore l'appel si elle est effectivement
  // invisible. Le garde vit ICI (pas seulement dans le listener de clic) pour
  // tenir quel que soit l'appelant — y compris le futur mini-jeu de la Task 10,
  // qui pourra appeler showInfo(id) directement sans passer par un événement DOM.
  // pointer-events:none statique est volontairement exclu de ces zones : elles
  // doivent rester cliquables dès qu'elles redeviennent visibles.
  if (el && parseFloat(getComputedStyle(el).opacity) < .05) return;
  currentId = id;
  $("#infoEmoji").textContent = z.em;
  $("#infoTitle").textContent = z.n;
  $("#infoText").textContent  = z.t;
  const info = $("#info");

  info.classList.remove("flash");
  void info.offsetWidth;                              // reflow : relance l'animation flash à chaque clic
  info.classList.add("flash");
  $$(".zone.selected").forEach(e => e.classList.remove("selected"));
  el?.classList.add("selected");
  if (el) showLabel(id, el);
  say(speakText(id));
}

let soundOn = false;                                  // COUPÉ PAR DÉFAUT (spec)
let voice = null;
function pickVoice(){
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /fr[-_]FR/i.test(v.lang) && /audrey|thomas|amelie|amélie|marie/i.test(v.name))
       || vs.find(v => /^fr/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
say = (text) => {                                     // remplace le stub de Task 7
  if (!soundOn || !("speechSynthesis" in window) || !text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR"; u.rate = .92; u.pitch = 1.05;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  }catch(e){ /* pas de voix : on continue sans son */ }
};
$("#sound").addEventListener("click", () => {
  soundOn = !soundOn;
  $("#sound").setAttribute("aria-pressed", String(soundOn));
  $("#sound").textContent = soundOn ? "🎧 Son allumé" : "🔇 Son coupé";
  if (!soundOn && "speechSynthesis" in window) speechSynthesis.cancel();
  else say("Le son est allumé !");
});
$("#say").addEventListener("click", () => { if (currentId) say(speakText(currentId)); });
